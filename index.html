<title>CLF 分野別ドリル</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* Layout: one reading column; chapters drawn like architecture-diagram regions (dashed outlines), topics as rows inside */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E8ECEA; --ink:#17201D; --muted:#5A6762; --line:#CCD5D1;
  --accent:#0F6E64; --accent-ink:#FFFFFF; --accent-soft:#DDEFEC;
  --ok:#1C7C45; --ok-soft:#DFF1E6; --ng:#B9412C; --ng-soft:#F8E3DE; --flag:#9A6A00; --flag-soft:#F7EDCF;
  --d1:#3E63B8; --d2:#0F6E64; --d3:#8A55B5; --d4:#B26A12;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201D; --sunk:#0C1110; --ink:#E3EAE7; --muted:#97A59F; --line:#2C3833;
  --accent:#4FC2B2; --accent-ink:#06201C; --accent-soft:#163A35;
  --ok:#5BCB88; --ok-soft:#163323; --ng:#EE8670; --ng-soft:#3A1E18; --flag:#E2B24A; --flag-soft:#352A10;
  --d1:#7E9DE6; --d2:#4FC2B2; --d3:#BB8FE0; --d4:#E3A256; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201D; --sunk:#0C1110; --ink:#E3EAE7; --muted:#97A59F; --line:#2C3833;
  --accent:#4FC2B2; --accent-ink:#06201C; --accent-soft:#163A35;
  --ok:#5BCB88; --ok-soft:#163323; --ng:#EE8670; --ng-soft:#3A1E18; --flag:#E2B24A; --flag-soft:#352A10;
  --d1:#7E9DE6; --d2:#4FC2B2; --d3:#BB8FE0; --d4:#E3A256; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .ttl{font-family:var(--f-display);font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .code{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:8px}
.btn.ghost:hover{border-color:var(--line)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.88rem}

/* home */
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.35rem;font-weight:600}
.stat span{font-size:.8rem;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.action:hover{border-color:var(--accent)}
.action strong{font-family:var(--f-display)}
.action span{font-size:.8rem;color:var(--muted)}
.howto{font-size:.88rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px}

.region{border:1.5px dashed var(--line);border-radius:14px;padding:14px;position:relative}
.region-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.region-no{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);letter-spacing:.06em}
.region-head h2{flex:1;min-width:0;font-size:1.08rem}
.meter{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;width:72px;flex:none}

.topics{display:flex;flex-direction:column;gap:6px}

.topic:hover{border-color:var(--accent)}
.topic .tname{flex:1;min-width:0}

.dom{font-size:.7rem;border-radius:4px;padding:0 6px;color:var(--surface);flex:none;font-weight:600}
.dom1{background:var(--d1)} .dom2{background:var(--d2)} .dom3{background:var(--d3)} .dom4{background:var(--d4)}

/* topic page */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.points li{display:flex;gap:10px;align-items:flex-start}
.points .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-family:var(--f-mono);background:var(--sunk);color:var(--muted);margin-top:3px}
.points .mk.ok{background:var(--ok-soft);color:var(--ok)}
.points .mk.ng{background:var(--ng-soft);color:var(--ng)}

details.peek summary{cursor:pointer;color:var(--accent);font-weight:500}
details.peek[open] summary{margin-bottom:10px}
.refs a{color:var(--accent)}

/* quiz */
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qmeta{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.lv{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.lv.exam{border-color:var(--d3);color:var(--d3)}
.qtext{font-size:1.02rem;line-height:1.85}
.need{display:inline-block;font-size:.82rem;font-weight:600;color:var(--accent);margin-top:6px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;line-height:1.65}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .key{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.82rem;background:var(--sunk);color:var(--muted)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .key{background:var(--accent);color:var(--accent-ink)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .key{background:var(--ok);color:var(--surface)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice.wrong .key{background:var(--ng);color:var(--surface)}
.choice .body{flex:1;min-width:0}

.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-weight:500}
.tip::before{content:"覚えどころ";display:block;font-size:.72rem;letter-spacing:.08em;color:var(--accent);font-weight:600}
.pointref{font-size:.84rem;color:var(--muted)}
.qfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* glossary links */
.term{background:none;border:0;padding:0;margin:0;cursor:pointer;border-bottom:1.5px dotted var(--accent);font:inherit;color:inherit;line-height:inherit}
.term:hover{color:var(--accent)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .in{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
#sheet h3{display:flex;gap:10px;align-items:center}
#sheet h3 span{flex:1}

/* result */
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--f-mono)}
.score b{font-size:2.6rem;font-weight:600;line-height:1}
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.qitem summary{display:flex;gap:10px;padding:10px 12px;cursor:pointer;list-style:none}
.qitem summary::-webkit-details-marker{display:none}
.qitem summary .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .det{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.okmk{color:var(--ok);font-weight:700;flex:none} .ngmk{color:var(--ng);font-weight:700;flex:none} .namk{color:var(--muted);flex:none}

/* mock */
.mockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-size:1.1rem;font-weight:600}
.timer.low{color:var(--ng)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.cell{min-height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:.82rem;position:relative}
.cell.done{background:var(--accent-soft);border-color:var(--accent)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.flagbtn.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.domrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:.9rem}
.domrow .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.domrow .track i{display:block;height:100%}
.passline{position:relative}
.confirm{border:1.5px solid var(--flag);background:var(--flag-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}

/* glossary */
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.gl{display:flex;flex-direction:column;gap:8px}
.gitem{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.gitem b{font-family:var(--f-display)}
.gitem .al{font-size:.78rem;color:var(--muted)}

/* study plan */
.today{border-color:var(--accent)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pi-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;line-height:1.5}
.pi-row:hover{border-color:var(--accent)}
.pi .pl{flex:1;min-width:0}
.pi.done .pl{color:var(--muted)}
.box{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.box.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.pday{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;scroll-margin-top:80px}
.pday.is-today{background:var(--accent-soft)}
.pdate{display:flex;gap:8px;align-items:center;font-weight:600;font-family:var(--f-mono);font-size:.88rem}
.chip.late{background:var(--ng-soft);color:var(--ng);border-color:transparent}
.lag{color:var(--ng)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
details.pweek>summary{cursor:pointer;list-style:none;margin-bottom:0}
details.pweek[open]>summary{margin-bottom:10px}
details.pweek>summary::-webkit-details-marker{display:none}
details.pweek>summary h2{font-size:1rem}
textarea.copy{width:100%;min-height:120px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink);padding:8px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

@media (max-width:560px){
  .hero,.actions{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat{padding:10px}
  .stat b{font-size:1.1rem}
  h1{font-size:1.35rem}
  .domrow{grid-template-columns:minmax(0,7em) minmax(0,1fr) 4em}
  .topic .best{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"><div class="loading">問題データを読み込んでいます…</div></div>
<div id="sheet" hidden><div class="in" role="dialog" aria-modal="false" aria-labelledby="sheet-t">
  <h3><span id="sheet-t"></span><button type="button" class="btn ghost sm" data-act="sheet-close" aria-label="閉じる">閉じる</button></h3>
  <p id="sheet-d" style="margin-top:6px"></p>
  <p class="small muted" id="sheet-a" style="margin-top:6px"></p>

<script>
"use strict";
const FILES = Array.from({length:12},(_,i)=>"ch"+String(i+1).padStart(2,"0"));
const DOM = {1:"コンセプト",2:"セキュリティ",3:"テクノロジー",4:"請求・サポート"};
const DOM_FULL = {1:"クラウドのコンセプト",2:"セキュリティとコンプライアンス",3:"クラウドテクノロジーとサービス",4:"請求、料金、およびサポート"};
const MOCK_DIST = {1:16,2:19,3:22,4:8}; // 65問。公式の配分 24/30/34/12% に合わせる
const MOCK_MIN = 90;
const PASS_RATE = 0.70;
const QUIZ_N = 10;
const KEYS = "ABCDE";

window.QB = {chapters:[], add(c){ this.chapters.push(c); }};

/* ---------- storage (同じブラウザ内に保存) ---------- */
const STORE = "clf-drill-v1";
const rec = (()=>{ let r=null; try{ r=JSON.parse(localStorage.getItem(STORE)||"null"); }catch(e){}
  return Object.assign({q:{},topics:{},mocks:[],mock:null}, r||{}); })();
function save(){ rec.u=Date.now(); saveLocal(); queuePush(); }
function saveLocal(){ try{ localStorage.setItem(STORE, JSON.stringify(rec)); }catch(e){} }

/* ---------- アカウントとの同期（claude.ai の db。サインインしていれば端末をまたいで同じ記録） ----------
   保存先は data/users/<自分のid>/drill の1文書。自分だけが読み書きでき、ほかの人（オーナーも）には見えない。
   端末ごとの記録は「新しい方」を項目ごとに選んで統合する（問題・トピックは各記録の t、学習計画は plan.u、全体は u）。
   「記録をリセット」は resetAt より古い記録を、同期しているすべての端末から外す。 */
const sync={state:"local", ref:null, writing:false, dirty:false, timer:null};
const SYNC_TEXT={
  local:"記録はこのブラウザにだけ保存されます。",
  connecting:"記録をアカウントと同期しています…",
  synced:"記録はアカウントに保存され、同じアカウントでサインインした端末と同期します。",
  offline:"同期先に接続できません。記録はこのブラウザに保存しています。",
  error:"同期できませんでした。記録はこのブラウザに保存しています。"};
function setSync(s){ sync.state=s; const el=document.getElementById("syncnote"); if(el) el.textContent=SYNC_TEXT[s]; }
const stable=v=>JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,key)=>(o[key]=x[key],o),{}):x);
const FIELDS=r=>({q:r.q||{}, topics:r.topics||{}, mocks:r.mocks||[], mock:r.mock||null, plan:r.plan||null, resetAt:r.resetAt||0, u:r.u||0});
function mergeRec(a,b){
  a=FIELDS(a); b=FIELDS(b);
  const ra=Math.max(a.resetAt,b.resetAt), newer=b.u>a.u?b:a;
  const pick=(x,y)=>{ const o={}; for(const k of new Set([...Object.keys(x),...Object.keys(y)])){
    const p=x[k], q=y[k], w=!p?q:!q?p:((q.t||0)>(p.t||0)?q:p); if(w && (w.t||0)>=ra) o[k]=w; } return o; };
  const seen=new Set(), mocks=[];
  for(const m of [...a.mocks,...b.mocks].sort((m,n)=>m.t-n.t)) if(m.t>=ra && !seen.has(m.t)){ seen.add(m.t); mocks.push(m); }
  const plan = !a.plan ? b.plan : !b.plan ? a.plan : ((b.plan.u||0)>(a.plan.u||0) ? b.plan : a.plan);
  return FIELDS({q:pick(a.q,b.q), topics:pick(a.topics,b.topics), mocks:mocks.slice(-20), mock:newer.mock, plan, resetAt:ra, u:Math.max(a.u,b.u)});
}
function applyRemote(data){
  const remote=FIELDS(JSON.parse(JSON.stringify(data)));
  const merged=mergeRec(rec, remote);
  if(view==="mock-run") merged.mock=rec.mock||null;   // 解いている最中の模試はこの端末のものを使う
  if(stable(merged)!==stable(FIELDS(rec))){
    Object.assign(rec, merged); saveLocal();
    if(!["quiz","mock-run","glossary"].includes(view)) render();
  }
  if(stable(merged)!==stable(remote)) queuePush();
}
function queuePush(){ if(!sync.ref) return; clearTimeout(sync.timer); sync.timer=setTimeout(push, 1500); }
async function push(retried){
  sync.timer=null;
  if(!sync.ref) return;
  if(sync.writing){ sync.dirty=true; return; }
  sync.writing=true;
  try{ await sync.ref.set(JSON.parse(JSON.stringify(FIELDS(rec)))); setSync("synced"); }
  catch(e){
    if(e && e.code==="unavailable" && !retried){ sync.writing=false; setTimeout(()=>push(true), 1000+Math.random()*2000); return; }
    // 閲覧だけの共有（招待した社外の人など）はアカウントに書けない：このブラウザだけに保存する
    if(e && (e.code==="invalid_argument" || e.code==="not_granted")){ sync.ref=null; sync.writing=false; setSync("local"); return; }
    setSync(e && e.code==="quota_exceeded" ? "error" : (e && e.code==="unavailable" ? "offline" : "error"));
  }
  sync.writing=false;
  if(sync.dirty){ sync.dirty=false; queuePush(); }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && sync.timer){ clearTimeout(sync.timer); push(); } });
async function initSync(){
  if(!window.claude || typeof window.claude.use!=="function") return;
  const [db,user]=await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if(!db || !user) return;
  if(await user.can("data.write")===false) return;   // 書き込めない人はこのブラウザだけに保存
  const uid=await user.id(); if(!uid) return;
  sync.ref=db.doc("data/users/"+uid+"/drill");
  setSync("connecting");
  const to=setTimeout(()=>{ if(sync.state==="connecting") setSync("offline"); }, 10000);
  sync.ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(to); if(sync.state==="connecting"||sync.state==="offline") setSync("synced"); }
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists) applyRemote(snap.data());
    else if(!snap.metadata.fromCache) queuePush();   // まだアカウントに記録がない：この端末の記録を送る
  }, ()=>{ clearTimeout(to); sync.ref=null; setSync("error"); });
}
function markQ(id, ok){ const r=rec.q[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok?1:0; r.t=Date.now(); rec.q[id]=r; }

const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const $ = s=>document.querySelector(s);

const fmtTime = s=>{ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0"); };
const fmtDate = t=>{ const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

/* ---------- index ---------- */
let CH=[], TOPICS=[], T={}, Q={}, GLOSS=[], GMAP=new Map(), GRE=null;
function buildIndex(){
  CH = QB.chapters.slice().sort((a,b)=>a.no-b.no);
  for(const ch of CH) for(const t of ch.topics){ t.ch=ch; TOPICS.push(t); T[t.id]=t;
    for(const q of t.questions){ q.t=t; q.dom = q.dom || t.dom; Q[q.id]=q; } }
  const seen=new Set();
  for(const ch of CH) for(const g of (ch.glossary||[])){
    if(seen.has(g.term)) continue; seen.add(g.term); g.ch=ch; GLOSS.push(g);
    for(const k of [g.term, ...(g.aliases||[])]){ const ek=esc(k); if(k && k.length>1 && !GMAP.has(ek)) GMAP.set(ek,g); }
  }
  GLOSS.sort((a,b)=>a.term.localeCompare(b.term,"ja"));
  const parts=[...GMAP.keys()].sort((a,b)=>b.length-a.length).map(k=>/^[\x00-\x7F]+$/.test(k)?`(?<![A-Za-z0-9])${escRe(k)}(?![A-Za-z0-9])`:escRe(k));
  try{ GRE = parts.length ? new RegExp(parts.join("|"),"g") : null; }catch(e){ GRE=null; }
}
/* 用語リンク：同じブロックで同じ用語は最初の1回だけリンクする */
function rich(text, used){
  let h = esc(text).replace(/\n/g,"<br>");
  if(!GRE) return h;
  used = used || new Set();
  return h.replace(GRE, m=>{ const g=GMAP.get(m); if(!g || used.has(g.term)) return m; used.add(g.term);
    return `<button type="button" class="term" data-act="term" data-term="${esc(g.term)}">${m}</button>`; });
}

function topicStatus(t){ const r=rec.topics[t.id]; if(!r) return {k:"none",label:"未着手"}; return r.last>=8 ? {k:"pass",label:"合格"} : {k:"learn",label:"学習中"}; }
function totals(){
  let n=0,c=0; for(const id in rec.q){ if(!Q[id]) continue; n+=rec.q[id].n; c+=rec.q[id].c; }
  const passed = TOPICS.filter(t=>topicStatus(t).k==="pass").length;
  const wrong = Object.keys(rec.q).filter(id=>Q[id] && rec.q[id].last===0).length;

}

function pointMarks(t){
  // 各ポイントの直近の理解度：そのポイントの問題の直近回答で判定
  const m={};
  for(const p of t.points){
    const qs=t.questions.filter(q=>q.p===p.id && rec.q[q.id]);
    if(!qs.length){ m[p.id]="none"; continue; }
    m[p.id] = qs.every(q=>rec.q[q.id].last===1) ? "ok" : "ng";
  }
  return m;
}

/* 小テストは問題ごとに選択・回答済み・結果を持つ（前の問題に戻っても回答した内容が残る） */
function mkItem(q){ return {id:q.id, perm:shuffle([...q.c.keys()]), sel:[], done:false, r:null}; }
function pickTopic(t){
  const score={}; for(const q of t.questions){ const r=rec.q[q.id]; score[q.id]=(r?(r.last?2:1):0)+Math.random(); }
  const by=q=>score[q.id];
  const chosen=[], pts=shuffle(t.points.map(p=>p.id));
  for(const p of pts){ if(chosen.length>=QUIZ_N) break; const c=t.questions.filter(q=>q.p===p).sort((a,b)=>by(a)-by(b))[0]; if(c) chosen.push(c); }
  const rest=t.questions.filter(q=>!chosen.includes(q)).sort((a,b)=>by(a)-by(b));
  while(chosen.length<QUIZ_N && rest.length) chosen.push(rest.shift());
  const pIdx=p=>t.points.findIndex(x=>x.id===p);
  const lv1=chosen.filter(q=>q.lv===1).sort((a,b)=>pIdx(a.p)-pIdx(b.p));
  const lv2=shuffle(chosen.filter(q=>q.lv!==1));
  return [...lv1, ...lv2];
}
function startSession(mode, qs, topicId){
  S={mode, topicId, items:qs.map(mkItem), i:0, res:[]};
  go("quiz");
}
function vQuiz(){

    <div class="choices">`;
  it.perm.forEach((orig,k)=>{
    let cls="";
    if(it.done){ if(q.a.includes(orig)) cls="right"; else if(it.sel.includes(orig)) cls="wrong"; }
    else if(it.sel.includes(orig)) cls="sel";
    h+=`<button type="button" class="choice ${cls}" data-act="pick" data-o="${orig}" ${it.done?"disabled":""} aria-pressed="${it.sel.includes(orig)}">
      <span class="key">${KEYS[k]}</span><span class="body">${rich(q.c[orig], used)}${it.done&&q.why?`<span class="why">${rich(q.why[orig], used)}</span>`:""}</span></button>`;
  });
  { // 「分からない」：選ぶとほかの選択は外れ、回答すると不正解として記録する（o = -1）
    const dk=it.sel.includes(-1), cls=it.done?(dk?"wrong":""):(dk?"sel":"");
    h+=`<button type="button" class="choice ${cls}" data-act="pick" data-o="-1" ${it.done?"disabled":""} aria-pressed="${dk}"><span class="key">?</span><span class="body">分からない</span></button>`; }
  h+=`</div>`;
  if(it.done){
    const ok=it.r.ok;
    const pt=q.t.points.find(p=>p.id===q.p);
    h+=`<div class="card stack" style="gap:12px">
      <div class="verdict ${ok?"ok":"ng"}">${ok?"正解":it.sel.includes(-1)?"分からない（不正解）":it.sel.length?"不正解":"無回答（不正解）"}<span class="small muted" style="font-family:var(--f-body)">正解は ${it.perm.map((o,k)=>q.a.includes(o)?KEYS[k]:null).filter(Boolean).join("・")}</span></div>
      <p>${rich(q.exp, used)}</p>
      <div class="tip">${esc(q.tip)}</div>
      ${pt?`<p class="pointref">学習ポイント：${esc(pt.text)}</p>`:""}

      ${last?`<button type="button" class="btn primary" data-act="qfinish">提出</button>`
            :`<button type="button" class="btn ${it.done?"primary":""}" data-act="qmove" data-d="1">次の問題 →</button>`}
    </div>`;
  h+=`</div>`;
  app.innerHTML=h;
}
/* 1問ずつの回答（選択肢を選んだときだけ） */
function answer(){
  const it=S.items[S.i], q=Q[it.id];
  if(it.done || !it.sel.length) return;
  const ok = it.sel.length===q.a.length && q.a.every(x=>it.sel.includes(x));
  it.r={id:q.id, ok, sel:it.sel.slice()}; it.done=true;
  markQ(q.id, ok); save(); render();
}
function qmove(d){
  S.i=Math.max(0,Math.min(S.items.length-1,S.i+d)); render(); window.scrollTo(0,0);
}
/* 提出：回答していない問題は選んでいる選択肢で採点し、未選択の問題は不正解にする */
function finishQuiz(){
  S.res=S.items.map(it=>{ if(!it.done){ const q=Q[it.id]; const ok=it.sel.length===q.a.length && q.a.every(x=>it.sel.includes(x));
    it.done=true; it.r={id:it.id, ok, sel:it.sel.slice()}; markQ(it.id,ok); } return it.r; });
  if(S.mode==="topic"){
    const score=S.res.filter(r=>r.ok).length;
    const r=rec.topics[S.topicId]||{runs:0,best:0};
    r.runs++; r.last=score; r.best=Math.max(r.best,score); r.t=Date.now(); rec.topics[S.topicId]=r;
  }
  save();
  go("result");
}

function qReview(id, sel, no){

  return `<details class="qitem"><summary>${mk}<span class="mono small muted">${no}</span><span class="s">${esc(q.q)}</span></summary><div class="det">
    <p>${rich(q.q, used)}</p>
    <div>${q.c.map((c,i)=>`<div class="small" style="margin-top:4px">${q.a.includes(i)?'<span class="okmk">正解</span>':sel&&sel.includes(i)?'<span class="ngmk">あなたの回答</span>':'<span class="namk">・</span>'} ${esc(c)}${q.why?`<div class="muted">${esc(q.why[i])}</div>`:""}</div>`).join("")}${sel&&sel.includes(-1)?'<div class="small" style="margin-top:4px"><span class="ngmk">あなたの回答</span> 分からない</div>':""}</div>

function newMock(){
  const pool={1:[],2:[],3:[],4:[]}, fb={1:[],2:[],3:[],4:[]};
  for(const q of Object.values(Q)) (q.lv===2?pool:fb)[q.dom]?.push(q);
  let ids=[];
  for(const d of [1,2,3,4]){
    let pick=shuffle(pool[d]).slice(0,MOCK_DIST[d]);
    if(pick.length<MOCK_DIST[d]) pick=pick.concat(shuffle(fb[d]).slice(0,MOCK_DIST[d]-pick.length));
    ids=ids.concat(pick.map(q=>q.id));
  }
  ids=shuffle(ids);
  const perms={}; for(const id of ids) perms[id]=shuffle([...Q[id].c.keys()]);
  rec.mock={ids, perms, ans:{}, flags:[], i:0, start:Date.now(), limit:MOCK_MIN*60, confirm:false};
  save(); go("mock-run");
}

function finishMock(){

/* ---------- study plan（日ごとのチェックリスト） ---------- */
const PLAN_DEF = {days:28};   // 初めて開いた日を開始日、その4週間後を受験日の初期値にする
const WD = "日月火水木金土";
const ymd = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseYmd = s=>{ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const md = d=>`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
let planScrolled=false;
function planCfg(){ if(!rec.plan){ const d=new Date(); rec.plan={start:ymd(d), exam:ymd(addDays(d,PLAN_DEF.days)), checks:{}}; } rec.plan.checks=rec.plan.checks||{}; return rec.plan; }
function buildPlan(){
  const cfg=planCfg(), start=parseYmd(cfg.start), exam=parseYmd(cfg.exam);
  if(isNaN(start)||isNaN(exam)) return {error:"開始日と受験日を入力してください。"};
  if((exam-start)/864e5 < 10) return {error:"受験日は開始日から10日以上あとにしてください。"};
  const lastStudy=addDays(exam,-6), days=[];
  for(let d=new Date(start); d<=lastStudy; d=addDays(d,1)) days.push({date:d, items:[]});
  // 平日1時間・土日3時間を想定：土日は平日の約2.5倍のトピックを割り振る
  const wt=d=>(d.getDay()%6===0)?2.5:1;
  const W=days.reduce((s,x)=>s+wt(x.date),0); let cum=0, ti=0;
  days.forEach((day,i)=>{
    const k=ymd(day.date);
    if(i===0) day.items.push({kind:"check", id:"book", label:"試験を予約する（Pearson VUE。受験日の24時間前までは無料で変更できます）"});
    else day.items.push({kind:"check", id:"rv-"+k, label:"間違えた問題を復習（10分）"});
    cum+=wt(day.date); const upto=Math.round(cum/W*TOPICS.length);
    while(ti<upto) day.items.push({kind:"topic", topic:TOPICS[ti++]});
    if(i>0 && day.date.getDay()%6===0) day.items.push({kind:"check", id:"redo-"+k, label:"8問未満だったトピックを解き直す"});
  });
  if(days.length>=2) days[days.length-2].items.push({kind:"check", id:"systest", label:"オンライン受験なら Pearson VUE のシステムテストを済ませる"});
  const fin=(n,items)=>days.push({date:addDays(exam,-n), items});
  const rv=n=>({kind:"check", id:"rv-"+ymd(addDays(exam,-n)), label:"間違えた問題を復習（10分）"});
  fin(5,[{kind:"mock", n:1, label:"模試1回目（65問・90分）"},{kind:"check", id:"mrev-1", label:"模試で間違えた問題の解説を読む"}]);
  fin(4,[rv(4),{kind:"check", id:"weak-1", label:"模試で正答率が低かった分野のトピックを解き直す"}]);
  fin(3,[{kind:"mock", n:2, label:"模試2回目"},{kind:"check", id:"mrev-2", label:"模試で間違えた問題の解説を読む"}]);
  fin(2,[rv(2),{kind:"check", id:"official", label:"AWS公式の練習問題（Skill Builder の Official Practice Question Set）を解く"}]);
  fin(1,[{kind:"mock", n:3, label:"模試3回目（疲れていれば軽い復習だけでOK）"},{kind:"check", id:"prep", label:"身分証の名前と会場（またはPC環境）を確認して、早めに寝る"}]);
  fin(0,[{kind:"check", id:"exam", label:"受験する"}]);
  return {days, start, exam};
}
function itemDone(it){
  const cfg=planCfg();
  if(it.kind==="topic") return !!rec.topics[it.topic.id];
  if(it.kind==="mock") return rec.mocks.filter(m=>m.t>=parseYmd(cfg.start).getTime()).length>=it.n;
  return !!cfg.checks[it.id];
}
function renderItem(it){
  const done=itemDone(it);
  const box=`<span class="box ${done?"on":""}" aria-hidden="true">${done?"✓":""}</span>`;
  if(it.kind==="topic"){ const st=topicStatus(it.topic);
    return `<li class="pi ${done?"done":""}"><button type="button" class="pi-row" data-act="topic" data-id="${it.topic.id}">${box}<span class="pl">${esc(it.topic.title)}</span><span class="chip ${st.k}">${st.label}</span></button></li>`; }
  if(it.kind==="mock")
    return `<li class="pi ${done?"done":""}"><button type="button" class="pi-row" data-act="nav" data-to="mock">${box}<span class="pl">${esc(it.label)}</span><span class="chip ${done?"pass":""}">${done?"実施済み":"模試へ"}</span></button></li>`;
  return `<li class="pi ${done?"done":""}"><button type="button" class="pi-row" data-act="plan-check" data-id="${esc(it.id)}" aria-pressed="${done}">${box}<span class="pl">${esc(it.label)}</span></button></li>`;
}
function planPace(p){
  const today=parseYmd(ymd(new Date())); let exp=0;
  for(const d of p.days) if(d.date<today) exp+=d.items.filter(i=>i.kind==="topic").length;
  const act=TOPICS.filter(t=>rec.topics[t.id]).length;
  return {exp, act, diff:act-exp};
}
const paceText = pc=> pc.diff===0 ? "予定どおりです" : pc.diff>0 ? `予定より ${pc.diff} トピック先に進んでいます` : `予定より ${-pc.diff} トピック遅れています`;

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]");
  if(!b){ if(!e.target.closest("#sheet")) closeSheet(); return; }
  const a=b.dataset.act;
  if(a!=="term" && a!=="sheet-close") closeSheet();
  switch(a){
    case "term": e.preventDefault(); e.stopPropagation(); openSheet(b.dataset.term); break;
    case "sheet-close": closeSheet(); break;
    case "nav":
      if(b.dataset.to==="mock" && view==="mock-run"){ clearInterval(timerId); timerId=null; }
      go(b.dataset.to); break;
    case "topic": go("topic", b.dataset.id); break;
    case "start": { const t=T[b.dataset.id]; startSession("topic", pickTopic(t), t.id); break; }
    case "pick": {
      const it=S.items[S.i]; if(it.done) break;
      const q=Q[it.id], o=+b.dataset.o;
      if(o===-1){ it.sel = it.sel.includes(-1) ? [] : [-1]; render(); break; }
      it.sel=it.sel.filter(x=>x!==-1);
      if(q.a.length===1) it.sel = it.sel.includes(o) ? [] : [o];
      else if(it.sel.includes(o)) it.sel=it.sel.filter(x=>x!==o);
      else if(it.sel.length<q.a.length) it.sel=[...it.sel,o];
      else it.sel=[...it.sel.slice(1),o];
      render(); break; }
    case "answer": answer(); break;
    case "qmove": qmove(+b.dataset.d); break;
    case "qfinish": finishQuiz(); break;

    case "mock-grid": M.showGrid=!M.showGrid; save(); render(); break;
    case "mock-jump": M.i=+b.dataset.k; M.confirm=false; save(); render(); window.scrollTo(0,0); break;

      M.ans[id]=s; save(); render(); break; }
    case "mock-flag": { const id=M.ids[M.i]; M.flags = M.flags.includes(id)? M.flags.filter(x=>x!==id) : [...M.flags,id]; save(); render(); break; }
    case "mock-confirm": M.confirm=true; render(); break;
    case "mock-cancel": M.confirm=false; render(); break;
    case "mock-finish": finishMock(); break;
    case "plan-check": { const c=planCfg().checks, id=b.dataset.id; if(c[id]) delete c[id]; else c[id]=Date.now(); planCfg().u=Date.now(); save(); render(); break; }
    case "mr-filter": viewArg.only=b.dataset.f; render(); break;
    case "reset-ask": $("#reset-box").innerHTML=`<div class="confirm"><strong>すべての記録を消去しますか？</strong><span>正答の記録・トピックの合否・模試の結果・学習計画のチェックが消え、元に戻せません（開始日と受験日は残ります）。${sync.ref?"同期しているほかの端末からも消えます。":""}</span><div class="row"><button type="button" class="btn primary" data-act="reset-do">消去する</button><button type="button" class="btn" data-act="reset-cancel">やめる</button></div></div>`; break;
    case "reset-cancel": $("#reset-box").innerHTML=""; break;
    case "reset-do": rec.q={}; rec.topics={}; rec.mocks=[]; rec.mock=null; planCfg().checks={}; planCfg().u=Date.now(); rec.resetAt=Date.now(); save(); go("home"); break;
  }
});
